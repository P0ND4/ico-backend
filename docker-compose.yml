# PostgreSQL se gestiona externamente — configura DB_* en .env
# Producción: docker compose --profile prod up -d
# Desarrollo:  docker compose --profile dev up -d

x-api-service: &api-service
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file:
    - .env
  environment:
    NODE_ENV: ${NODE_ENV:-production}
    REDIS_HOST: ${REDIS_HOST:-redis}
    REDIS_PORT: ${REDIS_PORT:-6379}
  volumes:
    - ico-logs:/app/logs
  depends_on:
    redis:
      condition: service_healthy
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/api/docs').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
      ]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 40s
  networks:
    - ico-network

services:
  api:
    <<: *api-service
    container_name: ico-api
    profiles: [prod]
    expose:
      - "3000"

  api-dev:
    <<: *api-service
    container_name: ico-api-dev
    profiles: [dev]
    ports:
      - "${PORT:-3000}:3000"

  redis:
    image: redis:7-alpine
    container_name: ico-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ico-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ico-network

  nginx:
    image: nginx:1.27-alpine
    container_name: ico-nginx
    restart: unless-stopped
    profiles: [prod]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./landing:/var/www/landing:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ico-network

  certbot:
    image: certbot/certbot
    container_name: ico-certbot
    restart: unless-stopped
    profiles: [prod]
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"
    networks:
      - ico-network

volumes:
  ico-logs:
  ico-redis-data:
  certbot-www:
  certbot-certs:

networks:
  ico-network:
    driver: bridge
